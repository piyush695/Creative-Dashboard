<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creative Studio — Single Screen (Redesign)</title>
<meta name="description" content="Single-screen, no-scroll Creative Studio. Left panel removed; all controls consolidated into one composer." />

<!--
  ============================================================================
  CREATIVE STUDIO — SINGLE-SCREEN REDESIGN  (standalone, no build step)
  ============================================================================
  GOAL OF THIS VERSION
    • Remove the left sidebar / CREATE panel entirely.
    • Fit everything on ONE screen — no page scroll.
    • Fold every Create control (Engine, Reference, Prompt, Styles, Direct,
      Aspect ratio, Generate) into ONE composer at the bottom of the canvas.

  LAYOUT MODEL — a single full-width column, vertical CSS grid:
      ┌──────────────────────────────────────────────┐
      │ topbar   (brand · nav · New chat · History)    │  auto
      ├──────────────────────────────────────────────┤
      │ tabs     (Custom · Top ads · Ad library · …)   │  auto
      ├──────────────────────────────────────────────┤
      │ stage    (empty-state hero, vertically centred)│  1fr  ← flexes
      ├──────────────────────────────────────────────┤
      │ composer (prompt + all controls + Generate)    │  auto
      └──────────────────────────────────────────────┘
    The whole grid is exactly 100dvh, so nothing scrolls the page; only the
    stage scrolls internally on very short viewports.

  THEME
    Driven by [data-theme="light|dark"] on <html>; tokens defined per theme.
  ============================================================================
-->

<style>
  /* ========================================================================
     1. DESIGN TOKENS  (HolaPrime palette in portable hsl/hex)
     ===================================================================== */
  :root,
  [data-theme="light"] {
    --bg:           #f7f8fa;
    --surface:      #ffffff;
    --surface-2:    #f1f3f7;
    --fg:           #1a1d29;
    --fg-muted:     #6b7280;
    --fg-subtle:    #9aa1ad;
    --border:       #e6e8ee;
    --border-strong:#d3d7e0;
    --primary:      #007aff;
    --primary-fg:   #ffffff;
    --primary-soft: #e8f1ff;
    --accent:       #ff5a3c;
    --accent-fg:    #ffffff;
    --ring:         #007aff66;
    --grad: linear-gradient(135deg,#0a4a8a 0%,#1184d6 52%,#0dd6ec 100%);
    --shadow-sm: 0 1px 2px rgba(20,24,40,.06), 0 2px 8px rgba(20,24,40,.05);
    --shadow-md: 0 4px 12px rgba(20,24,40,.08), 0 12px 28px rgba(20,24,40,.10);
    --shadow-lg: 0 12px 32px rgba(20,24,40,.16);
    --radius: 12px;
    --radius-sm: 8px;
  }
  [data-theme="dark"] {
    --bg:           #0f1320;
    --surface:      #181c2b;
    --surface-2:    #1f2436;
    --fg:           #f3f5fa;
    --fg-muted:     #9aa3b8;
    --fg-subtle:    #6b7488;
    --border:       #2a3045;
    --border-strong:#3a4159;
    --primary:      #3b9bff;
    --primary-fg:   #ffffff;
    --primary-soft: #15294a;
    --accent:       #ff6a4d;
    --accent-fg:    #ffffff;
    --ring:         #3b9bff66;
    --grad: linear-gradient(135deg,#1f63c4 0%,#1f9bdd 52%,#1ad0e8 100%);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 18px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  }

  /* ========================================================================
     2. RESET & BASE
     ===================================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
    color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;                 /* enforce single-screen, no page scroll */
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  ::placeholder { color: var(--fg-subtle); }
  .icon { width: 20px; height: 20px; flex: none; stroke-width: 1.8; }
  .icon-sm { width: 16px; height: 16px; stroke-width: 1.9; }

  /* ========================================================================
     3. APP GRID — one full-screen column
     ===================================================================== */
  .app {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
  }

  /* ---- 3a. TOP BAR ------------------------------------------------------ */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .brand__mark {
    width: 34px; height: 34px; flex: none; display: grid; place-items: center;
    border-radius: 10px; background: var(--grad); color: #fff; box-shadow: var(--shadow-sm);
  }
  .brand__meta { min-width: 0; }
  .brand__meta h1 {
    margin: 0; font-size: 14.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand__meta p { margin: 0; font-size: 12px; color: var(--fg-muted); }

  /* Top navigation — primary destinations (replaces the old icon rail) */
  .nav { display: flex; align-items: center; gap: 2px; margin-left: 18px; }
  .nav__link {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 12px; border: none; background: none; border-radius: 9px;
    font-size: 13px; font-weight: 500; color: var(--fg-muted);
    transition: background .15s, color .15s;
  }
  .nav__link:hover { background: var(--surface-2); color: var(--fg); }
  .nav__link[aria-current="page"] { color: var(--primary); background: var(--primary-soft); }

  .topbar__spacer { flex: 1; }
  .topbar__actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface); color: var(--fg);
    transition: background .15s, border-color .15s, filter .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn--primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
  .btn--primary:hover { filter: brightness(1.06); background: var(--primary); }
  .icon-btn {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 10px; color: var(--fg-muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); border-color: var(--border-strong); }

  /* ---- 3b. TABS --------------------------------------------------------- */
  .tabs {
    display: flex; align-items: center; gap: 4px;
    padding: 0 22px; background: var(--surface); border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; padding: 11px 13px; border: none; background: none;
    font-size: 13px; font-weight: 500; color: var(--fg-muted); white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--primary); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px;
    height: 2px; border-radius: 2px; background: var(--primary);
  }
  .tabs__end { margin-left: auto; }

  /* ---- 3c. STAGE (empty-state hero) ------------------------------------ */
  .stage {
    overflow-y: auto;                 /* only this area scrolls, if ever */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .stage__mark {
    width: 56px; height: 56px; display: grid; place-items: center;
    border-radius: 16px; background: var(--grad); color: #fff;
    box-shadow: var(--shadow-md); margin-bottom: 16px;
  }
  .stage h2 { margin: 0 0 6px; font-size: clamp(18px, 2.2vw, 22px); font-weight: 650; }
  .stage p { margin: 0 0 22px; max-width: 440px; color: var(--fg-muted); font-size: 14px; }

  .starters {
    display: grid; gap: 10px; width: 100%; max-width: 640px;
    grid-template-columns: repeat(4, 1fr);
  }
  .starter {
    text-align: left; padding: 13px 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface);
    transition: border-color .15s, box-shadow .15s, transform .12s;
  }
  .starter:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .starter strong { display: block; font-size: 13px; font-weight: 600; }
  .starter span { font-size: 12px; color: var(--fg-muted); }

  /* ========================================================================
     3d. COMPOSER — the consolidated Create surface
     The removed left panel lives here now: prompt + engine + reference +
     styles + direct + aspect + generate, all in one bordered card.
     ===================================================================== */
  .composer-wrap {
    padding: 14px 22px 18px; background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .composer {
    max-width: 920px; margin: 0 auto;
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--surface-2); box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }

  .composer__prompt {
    display: block; width: 100%; border: none; background: none; resize: none;
    padding: 14px 16px 6px; min-height: 52px; max-height: 132px;
    color: var(--fg); line-height: 1.55;
  }
  .composer__prompt:focus { outline: none; }

  /* Control row under the prompt */
  .composer__bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px 10px;
  }
  .composer__bar .spacer { flex: 1; min-width: 8px; }

  /* Wrapper that anchors a popover menu to its trigger (no button-in-button) */
  .ctrl-wrap { position: relative; display: inline-flex; }

  /* A control = soft pill button; some open popover menus */
  .ctrl {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 11px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 12.5px; font-weight: 500; color: var(--fg-muted);
    transition: border-color .15s, color .15s, background .15s;
  }
  .ctrl:hover { border-color: var(--border-strong); color: var(--fg); }
  .ctrl[aria-pressed="true"],
  .ctrl[aria-expanded="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .ctrl__badge {
    font-size: 10.5px; font-weight: 700; color: var(--primary);
    background: var(--primary-soft); padding: 2px 6px; border-radius: 5px;
  }
  .ctrl__count { color: var(--fg-subtle); font-weight: 600; }

  .btn-generate {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 18px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg);
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-sm);
    transition: filter .15s, transform .12s;
  }
  .btn-generate:hover { filter: brightness(1.06); }
  .btn-generate:active { transform: translateY(1px); }

  /* ---- Popover menus (Engine, Aspect) ---------------------------------- */
  .menu {
    position: absolute; bottom: calc(100% + 8px); left: 0;
    min-width: 220px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    display: none; z-index: 60;
  }
  .menu.open { display: block; }
  .menu--right { left: auto; right: 0; min-width: 130px; }
  .menu__item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: none; background: none; border-radius: 8px;
    font-size: 13px; color: var(--fg); text-align: left;
  }
  .menu__item:hover { background: var(--surface-2); }
  .menu__item[aria-checked="true"] { color: var(--primary); font-weight: 600; }
  .menu__item small { display: block; color: var(--fg-muted); font-weight: 400; font-size: 11.5px; }
  .menu__check { margin-left: auto; opacity: 0; }
  .menu__item[aria-checked="true"] .menu__check { opacity: 1; }

  /* Toast confirmation (Generate / Send feedback) */
  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(12px);
    background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ========================================================================
     4. RESPONSIVE
     ===================================================================== */

  /* Default: hidden on desktop. Media queries below reveal it. Declared
     BEFORE the queries so equal-specificity overrides win by source order. */
  .nav-toggle { display: none; }

  /* ---- TABLET ----------------------------------------------------------- */
  @media (max-width: 900px) {
    .nav { display: none; }                       /* nav folds into the menu button */
    .nav-toggle { display: grid; }
    .starters { grid-template-columns: repeat(2, 1fr); max-width: 520px; }
  }

  /* ---- MOBILE ----------------------------------------------------------- */
  @media (max-width: 600px) {
    .topbar { padding: 10px 14px; gap: 10px; }
    .tabs { padding: 0 14px; }
    .composer-wrap { padding: 10px 12px 14px; }
    .btn__text { display: none; }                 /* icon-only header actions */
    .btn { padding: 9px 11px; }
    .brand__meta p { display: none; }
    .stage { padding: 18px 14px; }
    .stage h2 { font-size: 18px; }
    .starters { grid-template-columns: 1fr; gap: 8px; }
    /* keep the two highest-value starters visible to protect the no-scroll goal */
    .starter:nth-child(n+3) { display: none; }
    .composer__bar .label-text { display: none; }  /* controls shrink to icons + badge */
    .menu { min-width: 200px; }
  }

  /* Very short screens: let the stage scroll rather than overflow the viewport */
  @media (max-height: 560px) {
    .stage__mark { width: 44px; height: 44px; margin-bottom: 10px; }
    .stage p { margin-bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>
<!--
  ==========================================================================
  STRUCTURE
    .app
      ├─ header.topbar   → brand, primary nav, New chat / History, theme, avatar
      ├─ nav.tabs        → content source switch
      ├─ section.stage   → empty-state hero + starter prompts
      └─ div.composer-wrap > .composer → the single consolidated input surface
  ==========================================================================
-->
<div class="app">

  <!-- ========================= TOP BAR ========================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
      </div>
      <div class="brand__meta">
        <h1>Summer sale — bold promo set</h1>
        <p>Custom · chat conversation</p>
      </div>
    </div>

    <!-- Primary navigation (was the left icon rail) -->
    <nav class="nav" aria-label="Primary">
      <button class="nav__link" aria-current="page">Create</button>
      <button class="nav__link">Library</button>
      <button class="nav__link">Insights</button>
      <button class="nav__link">Assets</button>
    </nav>

    <div class="topbar__spacer"></div>

    <div class="topbar__actions">
      <!-- New chat: start a fresh creative conversation. -->
      <button class="btn btn--primary" id="newChatBtn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn__text">New chat</span>
      </button>
      <!-- History: open prior conversations. -->
      <button class="btn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
        <span class="btn__text">History</span>
      </button>
      <!-- Theme toggle. -->
      <button class="icon-btn" id="themeBtn" aria-label="Toggle color theme">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
      <!-- Mobile/tablet nav menu (mirrors .nav links). -->
      <div class="ctrl-wrap">
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Open menu" aria-haspopup="menu" aria-expanded="false">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="menu menu--right" id="navMenu" role="menu" style="top:calc(100% + 8px);bottom:auto;">
          <button class="menu__item" role="menuitem">Create</button>
          <button class="menu__item" role="menuitem">Library</button>
          <button class="menu__item" role="menuitem">Insights</button>
          <button class="menu__item" role="menuitem">Assets</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================= TABS ========================= -->
  <nav class="tabs" role="tablist" aria-label="Creative sources">
    <button class="tab" role="tab" aria-selected="true">Custom</button>
    <button class="tab" role="tab" aria-selected="false">Top ads</button>
    <button class="tab" role="tab" aria-selected="false">Ad library</button>
    <button class="tab tabs__end" role="tab" aria-selected="false">
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>Assets
    </button>
  </nav>

  <!-- ========================= STAGE ========================= -->
  <section class="stage">
    <div class="stage__mark" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
    </div>
    <h2>Start a new creative</h2>
    <p>Describe the ad you want, drop a reference, or pick a starting point below. Variations appear right here in the conversation.</p>

    <!-- Starter prompts: one-tap presets that pre-fill the composer + focus it. -->
    <div class="starters">
      <button class="starter" data-prompt="Mid-season sale promo — bold, neon, 4:5">
        <strong>Mid-season sale promo</strong><span>Bold, neon, 4:5</span>
      </button>
      <button class="starter" data-prompt="UGC testimonial — authentic, story 9:16">
        <strong>UGC testimonial</strong><span>Authentic, story 9:16</span>
      </button>
      <button class="starter" data-prompt="Forex challenge hook — high-contrast A/B">
        <strong>Forex challenge hook</strong><span>High-contrast A/B</span>
      </button>
      <button class="starter" data-prompt="Carousel — bestsellers, clean product grid">
        <strong>Carousel — bestsellers</strong><span>Clean product grid</span>
      </button>
    </div>
  </section>

  <!-- ========================= COMPOSER (consolidated Create) ========================= -->
  <div class="composer-wrap">
    <div class="composer">
      <!-- PROMPT: core instruction. Auto-grows up to a cap. -->
      <textarea class="composer__prompt" id="prompt" rows="1"
        placeholder="Describe the ad creative — offer, tone, colors, aspect… or pick a starter above"></textarea>

      <!-- CONTROL BAR: everything from the old left panel lives here -->
      <div class="composer__bar">

        <!-- ENGINE: choose the model/pipeline. Opens a popover. -->
        <div class="ctrl-wrap">
          <button class="ctrl" id="engineBtn" aria-haspopup="menu" aria-expanded="false">
            <span class="ctrl__badge" id="engineBadge">3.0</span>
            <span class="label-text">Creative Engine</span>
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu" id="engineMenu" role="menu">
            <button class="menu__item" role="menuitemradio" aria-checked="true" data-badge="3.0">
              <span>Creative Engine 3.0<small>Multi-reference · consistency</small></span>
              <svg class="menu__check icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            <button class="menu__item" role="menuitemradio" aria-checked="false" data-badge="2.0">
              <span>Engine 2.0<small>Single image · fast</small></span>
              <svg class="menu__check icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            <button class="menu__item" role="menuitemradio" aria-checked="false" data-badge="LB">
              <span>Lightbox<small>Drafts · lowest cost</small></span>
              <svg class="menu__check icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
          </div>
        </div>

        <!-- REFERENCE: attach up to 10 reference images via hidden file input. -->
        <button class="ctrl" id="refBtn">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05l-8.5 8.5a5 5 0 11-7.07-7.07l8.49-8.49a3 3 0 114.24 4.24l-8.49 8.49a1 1 0 11-1.41-1.41l7.78-7.78"/></svg>
          <span class="label-text">Reference</span>
          <span class="ctrl__count" id="refCount">0/10</span>
        </button>
        <input type="file" id="refInput" accept="image/*" multiple hidden />

        <!-- STYLES: apply a curated preset (demo cycles through a few). -->
        <button class="ctrl" id="stylesBtn">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="label-text" id="stylesLabel">Styles</span>
        </button>

        <!-- DIRECT: bypass the pipeline; send the prompt verbatim to the model. -->
        <button class="ctrl" id="directBtn" aria-pressed="false">Direct</button>

        <span class="spacer"></span>

        <!-- ASPECT: output ratio. Opens a popover. -->
        <div class="ctrl-wrap">
          <button class="ctrl" id="aspectBtn" aria-haspopup="menu" aria-expanded="false">
            <span id="aspectLabel">4:5</span>
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu menu--right" id="aspectMenu" role="menu">
            <button class="menu__item" role="menuitemradio" aria-checked="false">1:1 <span class="menu__check" style="margin-left:auto">✓</span></button>
            <button class="menu__item" role="menuitemradio" aria-checked="true">4:5 <span class="menu__check" style="margin-left:auto">✓</span></button>
            <button class="menu__item" role="menuitemradio" aria-checked="false">9:16 <span class="menu__check" style="margin-left:auto">✓</span></button>
            <button class="menu__item" role="menuitemradio" aria-checked="false">16:9 <span class="menu__check" style="margin-left:auto">✓</span></button>
          </div>
        </div>

        <!-- GENERATE: primary action. Runs generation with current prompt + settings. -->
        <button class="btn-generate" id="generateBtn">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Generate
        </button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--
  ==========================================================================
  JAVASCRIPT — all interactions are fully wired:
  theme, tabs, nav menu, engine/aspect popovers, reference upload counter,
  styles cycle, direct toggle, prompt autogrow, starter fill, generate/send.
  ==========================================================================
-->
<script>
  (function () {
    var $  = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

    // --- Toast helper ------------------------------------------------------
    var toast = $('#toast'), toastTimer;
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1900);
    }

    // --- Theme toggle ------------------------------------------------------
    $('#themeBtn').addEventListener('click', function () {
      var root = document.documentElement;
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // --- Tabs (single-select) ---------------------------------------------
    var tabs = $$('.tab');
    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        tabs.forEach(function (x) { x.setAttribute('aria-selected', 'false'); });
        t.setAttribute('aria-selected', 'true');
      });
    });

    // --- Top nav (single-select) ------------------------------------------
    var links = $$('.nav__link');
    links.forEach(function (l) {
      l.addEventListener('click', function () {
        links.forEach(function (x) { x.removeAttribute('aria-current'); });
        l.setAttribute('aria-current', 'page');
      });
    });

    // --- Generic popover manager (engine, aspect, nav) --------------------
    // Closes any open menu when clicking elsewhere or pressing Escape.
    function wirePopover(btnSel, menuSel) {
      var btn = $(btnSel), menu = $(menuSel);
      if (!btn || !menu) return;
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var willOpen = !menu.classList.contains('open');
        closeAllMenus();
        if (willOpen) { menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
      });
      // Stop clicks inside the menu from bubbling to the button toggle.
      menu.addEventListener('click', function (e) { e.stopPropagation(); });
    }
    function closeAllMenus() {
      $$('.menu.open').forEach(function (m) { m.classList.remove('open'); });
      $$('[aria-expanded="true"]').forEach(function (b) {
        if (b.getAttribute('aria-haspopup') || b.id === 'navToggle') b.setAttribute('aria-expanded', 'false');
      });
    }
    document.addEventListener('click', closeAllMenus);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllMenus(); });

    wirePopover('#engineBtn', '#engineMenu');
    wirePopover('#aspectBtn', '#aspectMenu');
    wirePopover('#navToggle', '#navMenu');

    // --- Engine selection (updates badge) ---------------------------------
    $$('#engineMenu .menu__item').forEach(function (item) {
      item.addEventListener('click', function () {
        $$('#engineMenu .menu__item').forEach(function (x) { x.setAttribute('aria-checked', 'false'); });
        item.setAttribute('aria-checked', 'true');
        $('#engineBadge').textContent = item.getAttribute('data-badge');
        closeAllMenus();
      });
    });

    // --- Aspect selection (updates label) ---------------------------------
    $$('#aspectMenu .menu__item').forEach(function (item) {
      item.addEventListener('click', function () {
        $$('#aspectMenu .menu__item').forEach(function (x) { x.setAttribute('aria-checked', 'false'); });
        item.setAttribute('aria-checked', 'true');
        $('#aspectLabel').textContent = item.textContent.trim().charAt(0) === '✓'
          ? $('#aspectLabel').textContent
          : item.firstChild.textContent.trim();
        closeAllMenus();
      });
    });

    // --- Nav menu items (mobile) ------------------------------------------
    $$('#navMenu .menu__item').forEach(function (item) {
      item.addEventListener('click', function () { showToast('Open: ' + item.textContent); closeAllMenus(); });
    });

    // --- Reference upload (counter, capped at 10) -------------------------
    var refInput = $('#refInput'), refCount = $('#refCount'), refs = 0;
    $('#refBtn').addEventListener('click', function () { refInput.click(); });
    refInput.addEventListener('change', function () {
      refs = Math.min(10, refs + refInput.files.length);
      refCount.textContent = refs + '/10';
      $('#refBtn').setAttribute('aria-pressed', refs > 0 ? 'true' : 'false');
      if (refInput.files.length) showToast(refs + ' reference image' + (refs === 1 ? '' : 's') + ' attached');
      refInput.value = '';
    });

    // --- Styles cycle (demo presets) --------------------------------------
    var styles = ['Styles', 'Style: Neon', 'Style: Minimal', 'Style: Retro', 'Style: Luxe'], si = 0;
    var stylesBtn = $('#stylesBtn'), stylesLabel = $('#stylesLabel');
    stylesBtn.addEventListener('click', function () {
      si = (si + 1) % styles.length;
      stylesLabel.textContent = styles[si];
      stylesBtn.setAttribute('aria-pressed', si === 0 ? 'false' : 'true');
    });

    // --- Direct toggle -----------------------------------------------------
    var directBtn = $('#directBtn');
    directBtn.addEventListener('click', function () {
      var on = directBtn.getAttribute('aria-pressed') === 'true';
      directBtn.setAttribute('aria-pressed', String(!on));
    });

    // --- Prompt: auto-grow + Enter-to-generate ----------------------------
    var prompt = $('#prompt');
    function autogrow() { prompt.style.height = 'auto'; prompt.style.height = Math.min(132, prompt.scrollHeight) + 'px'; }
    prompt.addEventListener('input', autogrow);
    prompt.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
    });

    // --- Starter cards: fill prompt, focus -------------------------------
    $$('.starter').forEach(function (card) {
      card.addEventListener('click', function () {
        prompt.value = card.getAttribute('data-prompt');
        autogrow(); prompt.focus();
      });
    });

    // --- Generate / New chat ----------------------------------------------
    function generate() {
      var text = prompt.value.trim();
      if (!text) { prompt.focus(); showToast('Add a prompt or pick a starter first'); return; }
      var direct = directBtn.getAttribute('aria-pressed') === 'true';
      showToast((direct ? 'Direct · ' : '') + 'Generating ' + $('#aspectLabel').textContent + ' on Engine ' + $('#engineBadge').textContent + '…');
    }
    $('#generateBtn').addEventListener('click', generate);
    $('#newChatBtn').addEventListener('click', function () {
      prompt.value = ''; autogrow(); prompt.focus(); showToast('New chat started');
    });
  })();
</script>
</body>
</html>
